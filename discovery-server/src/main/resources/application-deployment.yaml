server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${DISCOVERY_SERVER_ZONE}
  server:
    enable-self-preservation: false
  instance:
    hostname: discovery-server

management:
  endpoint:
    health:
      show-details: NEVER